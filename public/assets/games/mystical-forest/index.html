<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mystical Forest Adventure</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.0/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <script src="slot-game.js"></script>
  <script>
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.source !== "taka69") return;
      if (d.type === "SET_BALANCE" && typeof d.balance === "number") {
        window.MEMBER_BALANCE = d.balance;
        if (typeof window.__mfSetBalance === "function") {
          window.__mfSetBalance(d.balance);
        }
      }
    });
    try { parent.postMessage({ source: "mystical-forest", type: "READY" }, "*"); } catch (e) {}
    window.addEventListener("resize", function () {
      try {
        if (typeof window.__mfFit === "function") window.__mfFit();
      } catch (e) {}
    });
  </script>
</body>
</html>
