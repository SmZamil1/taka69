<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mystical Forest Adventure</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.0/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <script src="slot-game.js"></script>
  <script>
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.source !== "taka69") return;
      if (d.type === "SET_BALANCE" && typeof d.balance === "number") {
        window.MEMBER_BALANCE = d.balance;
        if (typeof window.__mfSetBalance === "function") {
          window.__mfSetBalance(d.balance);
        }
      }
    });
    try { parent.postMessage({ source: "mystical-forest", type: "READY" }, "*"); } catch (e) {}
    // Keep canvas filling viewport on rotate
    window.addEventListener("resize", function () {
      try {
        if (window.app && window.app.renderer) {
          window.app.renderer.resize(window.innerWidth, window.innerHeight);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
