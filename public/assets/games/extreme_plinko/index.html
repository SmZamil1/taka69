<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05080a" />
  <title>Extreme Plinko · TAKA69</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    html, body {
      margin: 0;
      background: #05080a;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #canvasHolder {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      background: #05080a;
      z-index: 1;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at 50% 30%, #0b2a33, #05080a 70%);
      transition: opacity .4s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .spin {
      width: 46px; height: 46px;
      border: 2px solid rgba(34,211,238,.18);
      border-top-color: #22d3ee;
      border-radius: 999px;
      animation: spin .75s linear infinite;
    }
    #boot .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
    #err {
      display: none;
      position: fixed; inset: 0; z-index: 30;
      align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: #05080a; text-align: center; padding: 24px;
    }
    #err.show { display: flex; }
    #err button {
      border: 0; border-radius: 12px; padding: 10px 16px;
      background: #22d3ee; color: #042; font-weight: 800; cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>
  <div id="boot">
    <div class="spin"></div>
    <div class="lbl">Loading Extreme Plinko…</div>
  </div>
  <div id="err">
    <div style="font-weight:800;font-size:16px">Plinko failed to start</div>
    <div style="font-size:12px;opacity:.6;max-width:280px">Tap retry. If it keeps failing, hard-refresh the app.</div>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>

  <!-- Engine requires canvas#canvasHolder -->
  <canvas id="canvasHolder" width="720" height="1280"></canvas>

  <script>
    // Host bridge + safe defaults before engine scripts
    window.CURRENCY_SYMBOL = "৳";
    window.CURRENCY_CODE = "BDT";
    window.MEMBER_BALANCE = window.MEMBER_BALANCE || 0;
    window.IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    // Prevent demo host redirect
    window.__TAKA69_HOST__ = true;
    function postReady() {
      try { parent.postMessage({ source: "extreme-plinko", type: "READY" }, "*"); } catch (e) {}
    }
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.source !== "taka69") return;
      if (d.type === "SET_BALANCE" && typeof d.balance === "number") {
        window.MEMBER_BALANCE = d.balance;
        try {
          if (window.$ && $.editor) $.editor.credit = d.balance;
        } catch (e) {}
      }
    });
    window.onerror = function () {
      var e = document.getElementById("err");
      if (e) e.classList.add("show");
      var b = document.getElementById("boot");
      if (b) b.classList.add("hide");
    };
  </script>

  <script src="js/vendor/createjs.min.js"></script>
  <script src="js/vendor/TweenMax.min.js"></script>
  <script src="js/vendor/p2.min.js"></script>
  <script src="js/vendor/mobile-detect.js"></script>
  <script src="cross.js"></script>
  <script src="js/init.js"></script>
  <script>
    // Many builds auto-boot; if not, try common entry points after load
    function tryBoot() {
      var tried = false;
      try {
        if (typeof initMain === "function") { initMain(); tried = true; }
      } catch (e) { console.warn("initMain", e); }
      try {
        if (!tried && typeof startGame === "function") { startGame(); tried = true; }
      } catch (e) { console.warn("startGame", e); }
      try {
        if (!tried && typeof initGame === "function") { initGame(); tried = true; }
      } catch (e) { console.warn("initGame", e); }
      try {
        if (typeof initGameCanvas === "function" && !window.stage) {
          var w = Math.max(320, window.innerWidth || 360);
          var h = Math.max(480, window.innerHeight || 640);
          initGameCanvas(w, h);
        }
      } catch (e) { console.warn("initGameCanvas", e); }
      // resize canvas holder to viewport
      try {
        var c = document.getElementById("canvasHolder");
        if (c) {
          c.width = Math.floor(window.innerWidth * (window.devicePixelRatio || 1));
          c.height = Math.floor(window.innerHeight * (window.devicePixelRatio || 1));
          c.style.width = "100%";
          c.style.height = "100%";
        }
      } catch (e) {}
    }

    window.addEventListener("load", function () {
      setTimeout(tryBoot, 50);
      setTimeout(tryBoot, 400);
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) b.classList.add("hide");
        setTimeout(function () { if (b) b.remove(); }, 450);
        postReady();
      }, 1800);
    });

    window.addEventListener("resize", function () {
      try {
        if (typeof resizeGame === "function") resizeGame();
      } catch (e) {}
    });
  </script>
</body>
</html>
