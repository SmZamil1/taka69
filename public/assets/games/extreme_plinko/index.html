<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05080a" />
  <title>Extreme Plinko · TAKA69</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    html, body {
      margin: 0;
      background: #05080a;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }
    #canvasHolder {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #05080a;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: #05080a;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    #boot.hide { opacity: 0; }
    #boot .spin {
      width: 42px; height: 42px;
      border: 2px solid rgba(34,211,238,.2);
      border-top-color: #22d3ee;
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- jQuery required by cross.js / overlay -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>
  <div id="boot">
    <div class="spin"></div>
    <div style="font-size:12px;opacity:.55">Loading Extreme Plinko…</div>
  </div>
  <!-- Game engine expects #canvasHolder -->
  <canvas id="canvasHolder"></canvas>

  <script src="js/vendor/createjs.min.js"></script>
  <script src="js/vendor/TweenMax.min.js"></script>
  <script src="js/vendor/p2.min.js"></script>
  <script src="js/vendor/mobile-detect.js"></script>
  <script>
    // Soften iframe hostname gate from cross.js (demo asset)
    window.CURRENCY_SYMBOL = "৳";
    window.CURRENCY_CODE = "BDT";
    // Provide no-op parent bridge
    window.parent && window.parent.postMessage && window.parent.postMessage(
      { source: "extreme-plinko", type: "READY" },
      "*"
    );
  </script>
  <script src="cross.js"></script>
  <script src="js/init.js"></script>
  <script>
    // Hide boot overlay once stage likely ready
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (b) b.classList.add("hide");
      setTimeout(function () { if (b) b.remove(); }, 400);
      try {
        window.parent.postMessage({ source: "extreme-plinko", type: "READY" }, "*");
      } catch (e) {}
    }, 1600);

    // Listen for balance push from host
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.source !== "taka69") return;
      if (d.type === "SET_BALANCE" && typeof d.balance === "number") {
        try {
          window.MEMBER_BALANCE = d.balance;
          if (window.$ && $.editor) $.editor.credit = d.balance;
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
