<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Aviator Unity · TAKA69</title>
  <style>
    html,body,#unity-container { margin:0; width:100%; height:100%; background:#0b0b0b; overflow:hidden; }
    #unity-canvas { width:100%; height:100%; display:block; background:#0b0b0b; }
    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column; gap:10px;
      align-items:center; justify-content:center; color:#fbbf24; font-family:system-ui;
      background:radial-gradient(circle at 50% 30%, #2a1008, #000 70%); z-index:5;
    }
    #fail {
      display:none; position:fixed; inset:0; z-index:10; align-items:center; justify-content:center;
      flex-direction:column; gap:12px; background:#000; color:#fff; font-family:system-ui; text-align:center; padding:24px;
    }
    #fail.show { display:flex; }
    #fail a, #fail button {
      border:0; border-radius:12px; padding:10px 14px; font-weight:800; cursor:pointer; text-decoration:none;
    }
    #fail .primary { background:#f97316; color:#111; }
    #fail .ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.2); }
  </style>
</head>
<body>
  <div id="loading">
    <div>Loading AirCrash WebGL…</div>
    <div id="pct" style="opacity:.5;font-size:12px">0%</div>
  </div>
  <div id="fail">
    <div style="font-size:16px;font-weight:900">Unity build needs React bridge</div>
    <div style="opacity:.65;font-size:12px;max-width:300px">
      This package expects react-unity-webgl host events. Use native Aviator for full wallet play.
    </div>
    <a class="primary" href="/games/aviator" target="_top">Open native Aviator</a>
    <button class="ghost" type="button" onclick="location.reload()">Retry</button>
  </div>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <script>
    // ---- Bridge stubs required by this Unity build (react-unity-webgl) ----
    (function () {
      // Prevent noisy alert popups from Unity exception handler
      var _alert = window.alert;
      window.alert = function (msg) {
        try {
          console.warn("[unity-alert]", msg);
          parent.postMessage({ source: "aviator-unity", type: "ERROR", message: String(msg || "") }, "*");
        } catch (e) {}
        // if critical, show soft fail UI instead of OS dialog
        var s = String(msg || "");
        if (/dispatchReactUnityEvent|Unity content|TypeError/i.test(s)) {
          var f = document.getElementById("fail");
          if (f) f.classList.add("show");
          var l = document.getElementById("loading");
          if (l) l.style.display = "none";
        }
      };

      // react-unity-webgl injects this; Unity C# calls it via SendMessage reverse bridge
      window.dispatchReactUnityEvent = function (eventName, payload) {
        try {
          parent.postMessage({
            source: "aviator-unity",
            type: "UNITY_EVENT",
            eventName: String(eventName || ""),
            payload: payload,
          }, "*");
        } catch (e) {}
        return true;
      };

      // Some builds look for these helpers
      window.Unity = window.Unity || {};
      window.unityInstance = null;
      window.gameReady = false;

      // Soft error trap
      window.addEventListener("error", function (ev) {
        var msg = (ev && (ev.message || (ev.error && ev.error.message))) || "";
        if (/dispatchReactUnityEvent/i.test(String(msg))) {
          ev.preventDefault();
          window.alert(msg);
        }
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var msg = (ev && ev.reason && (ev.reason.message || ev.reason)) || "";
        if (/dispatchReactUnityEvent/i.test(String(msg))) {
          ev.preventDefault();
          window.alert(String(msg));
        }
      });
    })();
  </script>

  <script src="AirCrash.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = ".";
    var config = {
      dataUrl: buildUrl + "/AirCrash.data.unityweb",
      frameworkUrl: buildUrl + "/AirCrash.framework.js.unityweb",
      codeUrl: buildUrl + "/AirCrash.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "TAKA69",
      productName: "Aviator",
      productVersion: "1.0",
      showBanner: function () {},
    };

    function hideLoading() {
      var el = document.getElementById("loading");
      if (el) el.style.display = "none";
    }

    function boot(loaderSrc, cfg, onFail) {
      function run() {
        if (typeof createUnityInstance !== "function") {
          onFail && onFail(new Error("createUnityInstance missing"));
          return;
        }
        createUnityInstance(canvas, cfg, function (p) {
          var el = document.getElementById("pct");
          if (el) el.textContent = Math.round(p * 100) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          window.gameReady = true;
          hideLoading();
          try { parent.postMessage({ source: "aviator-unity", type: "READY" }, "*"); } catch (e) {}
          // Keep feeding dummy host pings some builds expect
          try {
            if (instance && instance.SendMessage) {
              // no-op safe calls if game objects exist later
            }
          } catch (e) {}
        }).catch(function (err) {
          console.warn("unity boot fail", err);
          onFail && onFail(err);
        });
      }
      if (loaderSrc) {
        var s = document.createElement("script");
        s.src = loaderSrc;
        s.onload = run;
        s.onerror = function () { onFail && onFail(new Error("loader failed")); };
        document.body.appendChild(s);
      } else {
        run();
      }
    }

    // Primary AirCrash, then WebGL fallback
    boot(null, config, function () {
      var cfg2 = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TAKA69",
        productName: "Aviator",
        productVersion: "1.0",
        showBanner: function () {},
      };
      boot("WebGL.loader.js", cfg2, function (e2) {
        hideLoading();
        var f = document.getElementById("fail");
        if (f) f.classList.add("show");
        try { parent.postMessage({ source: "aviator-unity", type: "ERROR", message: String(e2) }, "*"); } catch (e) {}
      });
    });
  </script>
</body>
</html>
